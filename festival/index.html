<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Adam × Natália</title>
<style>
:root{--bg:#0c0c0f;--panel:#16161b;--panel2:#1d1d23;--text:#f2f0ea;--muted:#9a978f;--line:#33333b;--accent:#f2f0ea;--green:#58d68d;--pink:#ff6b9a;--yellow:#ffd166;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(255,107,154,.13),transparent 36%),radial-gradient(circle at 82% 12%,rgba(88,214,141,.12),transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:720px;padding:22px 16px 44px;position:relative;z-index:1}
.bg{position:fixed;inset:auto 0 1vh 0;text-align:center;font-size:clamp(48px,18vw,130px);opacity:.04;letter-spacing:.08em;pointer-events:none;user-select:none}
header{text-align:center;margin:8px 0 18px}h1{font-size:clamp(32px,8vw,54px);font-weight:950;letter-spacing:-1.4px;text-transform:uppercase;line-height:.96}.sub{color:var(--muted);font-size:14px;margin-top:10px}.topbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}.stat{background:rgba(22,22,27,.8);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}.progress{height:8px;background:#24242b;border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--green));border-radius:99px;transition:width .3s ease}.card{background:linear-gradient(160deg,rgba(29,29,35,.96),rgba(13,13,16,.96));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.35);overflow:hidden}.hero{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding:24px 18px}.hero p{color:var(--muted);line-height:1.5;max-width:480px}.mascot{align-self:stretch;display:flex;gap:10px;align-items:flex-start;justify-content:center}.face{font-size:26px;white-space:nowrap;flex-shrink:0;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35))}.bubble{background:#22222a;border:1px solid #3b3b45;border-radius:16px;padding:12px 14px;color:#e8e6dd;text-align:left;line-height:1.35;max-width:430px}.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}button{appearance:none;border:1px solid var(--line);background:#202028;color:var(--text);border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .15s ease,background .15s ease,opacity .15s ease}button:hover{background:#2a2a33;transform:translateY(-1px)}button:active{transform:scale(.98)}button.primary{background:var(--accent);color:#101014;border:0;padding:14px 22px}button.danger{color:#ffd3d3}.draw-area{display:flex;flex-direction:column;gap:14px}.draw-card{min-height:330px;display:flex;flex-direction:column;gap:14px;position:relative}.draw-card.reveal{animation:pop .28s ease}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}.artist-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.artist h2{font-size:clamp(28px,8vw,44px);line-height:.98;letter-spacing:-.8px}.price{background:linear-gradient(135deg,var(--yellow),#ff9f1c);color:#17130b;border-radius:16px;padding:10px 12px;font-weight:950;font-size:22px;white-space:nowrap}.songs{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #3a3a44;background:#24242c;border-radius:999px;padding:7px 10px;color:#d9d6ce;font-size:13px}.verdict{border-radius:16px;padding:13px 14px;font-weight:850;line-height:1.35}.yes{background:rgba(88,214,141,.14);border:1px solid rgba(88,214,141,.45);color:#bff5d3}.no{background:rgba(255,107,107,.13);border:1px solid rgba(255,107,107,.45);color:#ffd0d0}iframe{width:100%;height:80px;border:0;border-radius:12px;background:#111;margin-top:auto}.lineup{display:flex;flex-direction:column;gap:8px}.slot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#141418;border:1px solid #2d2d35;border-radius:14px;padding:10px 12px}.slot .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#292932;color:#bbb;font-weight:900;font-size:12px}.empty{color:#686862}.mini{font-size:12px;color:var(--muted);margin-top:2px}.poster{background:linear-gradient(165deg,#211629,#0e1814 62%,#101014);border:1px solid #3b3340;border-radius:24px;padding:22px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.48);position:relative;overflow:hidden}.poster:before{content:"🐱  🐰  🐀  🐭";position:absolute;inset:12px auto auto 50%;transform:translateX(-50%);opacity:.16;font-size:24px;letter-spacing:18px;white-space:nowrap}.poster h2{font-size:clamp(36px,10vw,64px);line-height:.88;text-transform:uppercase;letter-spacing:-1.6px;margin-top:30px}.datebox{margin:16px auto 20px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--muted)}input{background:#0e0e12;color:var(--text);border:1px solid #3a3a44;border-radius:12px;padding:12px 13px;font:inherit;max-width:220px}.poster-list{display:flex;flex-direction:column;gap:8px;align-items:center;margin:14px 0}.poster-act{width:100%;border-radius:14px;padding:10px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}.poster-act.head{font-size:clamp(29px,8vw,50px);font-weight:950;text-transform:uppercase;letter-spacing:-1px}.poster-act.mid{font-size:clamp(22px,6vw,34px);font-weight:900}.poster-act.small{font-size:clamp(17px,4.5vw,24px);font-weight:850}.confetti{position:fixed;z-index:5;left:50%;top:46%;font-size:24px;pointer-events:none;animation:boom .8s ease forwards}.fade{animation:fade .25s ease}.shake{animation:shake .32s ease}@keyframes pop{from{opacity:.2;transform:rotateX(20deg) scale(.98)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(50deg);opacity:0}}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}@media(max-width:520px){.topbar{grid-template-columns:1fr 1fr}.topbar .stat:first-child{grid-column:1 / -1}.artist-row{flex-direction:column}.price{align-self:flex-start}.slot{grid-template-columns:auto 1fr}.slot strong:last-child{grid-column:2}.wrap{padding-inline:12px}}
</style>
</head>
<body>
<div class="bg">ᘛ⁐̤ᕐᐷ</div>
<main class="wrap" id="app"></main>
<script id="festival-data" type="application/json">{"artists":[{"name":"Title Fight","herCount":60,"himCount":67,"songs":["Numb, But I Still Feel It","In-Between","Liar's Love","Shed"],"trackId":"6BQcuknn21BEpig4PEPtD4","trackTitle":"Numb, But I Still Feel It"},{"name":"Sonic Youth","herCount":59,"himCount":34,"songs":["Shadow of a Doubt","Incinerate","Anagrama","Beautiful Plateau - Non-LP version"],"trackId":"0mYaDPgvNkXgXS3TVjuITD","trackTitle":"Shadow of a Doubt"},{"name":"Superheaven","herCount":21,"himCount":28,"songs":["I've Been Bored","Next To Nothing","Room","All the Pain"],"trackId":"3zi9xNpG2WHCdCAxV0BpJm","trackTitle":"I've Been Bored"},{"name":"Radiohead","herCount":6,"himCount":17,"songs":["Black Star","Fake Plastic Trees","Let Down","India Rubber"],"trackId":"6UO72VSXEONxdfLyABihs9","trackTitle":"Black Star"},{"name":"Nirvana","herCount":21,"himCount":4,"songs":["Clean Up Before She Comes - Solo Acoustic","All Apologies - Home Demo","Sliver - Solo Acoustic Demo","Rape Me - Solo Acoustic"],"trackId":"46m6dFnBEfdcGNwyEP2fBd","trackTitle":"Clean Up Before She Comes - Solo Acoustic"},{"name":"Hum","herCount":3,"himCount":24,"songs":["Stars","I Hate It Too","I'd Like Your Hair Long"],"trackId":"6lQE6LF3MU63Z6VyhPxaV3","trackTitle":"Stars"},{"name":"The Wilderness","herCount":25,"himCount":1,"songs":["Každý z nás je tak trochu Hiró Onoda","Nedlžím ti nič!","Čo s tým hnevom?","Juche (tɕutɕʰe)"],"trackId":"1qePNzqdiSzyMz5NDU0H4i","trackTitle":"Každý z nás je tak trochu Hiró Onoda"},{"name":"The Smiths","herCount":16,"himCount":3,"songs":["Unloveable - 2017 Master","This Night Has Opened My Eyes - 2011 Remaster","What Difference Does It Make? - John Peel Session 18/05/83","Shoplifters of the World Unite - 2011 Remaster"],"trackId":"14WNN9XlshGSckMBNcP6Ez","trackTitle":"Unloveable - 2017 Master"},{"name":"Deftones","herCount":22,"himCount":1,"songs":["Dai the Flu","Be Quiet and Drive (Far Away)","Mascara","Lotion"],"trackId":"2cN7qiHMJflO91pkG9HoO1","trackTitle":"Dai the Flu"},{"name":"Jaromir Nohavica","herCount":5,"himCount":7,"songs":["Pisen o manzelstvi","Stanice Jiřího Z Poděbrad - Live","U Nás Na Severu"],"trackId":"2sblDgy0L1RTxSXm32Vj1i","trackTitle":"Pisen o manzelstvi"},{"name":"Slowdive","herCount":16,"himCount":1,"songs":["Souvlaki Space Station","When the Sun Hits","40 Days","Machine Gun"],"trackId":"76JhicgPtW4zbN72tpnMyA","trackTitle":"Souvlaki Space Station"},{"name":"The Cure","herCount":16,"himCount":1,"songs":["Pictures Of You - Remastered","Lullaby - Remastered","Lovesong - Remastered","Disintegration - Remastered"],"trackId":"2o49Twc3qrNMOt8gq9W06L","trackTitle":"Pictures Of You - Remastered"},{"name":"Unwound","herCount":8,"himCount":3,"songs":["Demons Sing Love Songs","Off This Century","October All Over","Look a Ghost"],"trackId":"7Fx68xe5jmn8sCRm7aGOR4","trackTitle":"Demons Sing Love Songs"},{"name":"Pantera","herCount":14,"himCount":1,"songs":["Walk","This Love","10's","The Great Southern Trendkill"],"trackId":"7fcfNW0XxTWlwVlftzfDOR","trackTitle":"Walk"},{"name":"Small Town Life","herCount":7,"himCount":2,"songs":["Matchless Seal","Emptiness","Narrow Minds","Sarcasm"],"trackId":"7AmYKj16zTLMcMbRQX4eq9","trackTitle":"Matchless Seal"},{"name":"Porcupine Tree","herCount":9,"himCount":1,"songs":["Blackest Eyes - 2017 Remaster","Drown With Me","Lazarus","Arriving Somewhere But Not Here - 2017 Remaster"],"trackId":"5RYbKJ3psLCFGKEqyJ931Y","trackTitle":"Blackest Eyes - 2017 Remaster"},{"name":"The Smashing Pumpkins","herCount":1,"himCount":8,"songs":["Luna - 2011 Remaster"],"trackId":"5Q6Xzp25aXYxNJ4B6vBkcf","trackTitle":"Luna - 2011 Remaster"},{"name":"Horkýže Slíže","herCount":6,"himCount":1,"songs":["Banda tupých hláv","Vlak","L.A.G. Song","Brďokoky"],"trackId":"7Hi4Bi0YYONp1YhuP1fTv8","trackTitle":"Banda tupých hláv"},{"name":"Chevelle","herCount":1,"himCount":5,"songs":["Comfortable Liar"],"trackId":"412LyfktkgWKEn8kmKiyQe","trackTitle":"Comfortable Liar"},{"name":"LSD and the Search for God","herCount":5,"himCount":1,"songs":["Heaven","(I Don't Think That We Should) Take It Slow","Starting Over","This Time"],"trackId":"1La3oTBpUJztVxuwiPnjjj","trackTitle":"Heaven"},{"name":"Black Country, New Road","herCount":1,"himCount":4,"songs":["Basketball Shoes"],"trackId":"4ShVovnLIlObG43vwaCRkJ","trackTitle":"Basketball Shoes"},{"name":"Cherries & Therapy","herCount":4,"himCount":1,"songs":["Veď Kvety Kvitnú v Tvojom Náručí","Teplo Lásky","Mramorové Schody","Vločka"],"trackId":"6lfBhehLKJbfqTTLDGko9j","trackTitle":"Veď Kvety Kvitnú v Tvojom Náručí"},{"name":"Karel Kryl","herCount":4,"himCount":1,"songs":["Srdce A Kříž","Monika","Nehažte Kamení - Live","Podivná Ruleta"],"trackId":"0E2JXEDWBbCBKwnDu3hiOG","trackTitle":"Srdce A Kříž"},{"name":"Rod Stewart","herCount":1,"himCount":3,"songs":["Da Ya Think I'm Sexy? - 2008 Remaster"],"trackId":"2MRPFJIOChJbwNGKc9a77H","trackTitle":"Da Ya Think I'm Sexy? - 2008 Remaster"},{"name":"Richard Muller","herCount":1,"himCount":2,"songs":["Nocna optika"],"trackId":"7svPcHhXXzVDzBCTB7b0dd","trackTitle":"Nocna optika"},{"name":"Anita Soul","herCount":1,"himCount":1,"songs":["Ona Má šýl (feat. Anita Soul & Rytmus)"],"trackId":"5Nn5oeaHN5ws7MZ6sK2RBm","trackTitle":"Ona Má šýl (feat. Anita Soul & Rytmus)"},{"name":"Rytmus","herCount":1,"himCount":1,"songs":["Ona Má šýl (feat. Anita Soul & Rytmus)"],"trackId":"5Nn5oeaHN5ws7MZ6sK2RBm","trackTitle":"Ona Má šýl (feat. Anita Soul & Rytmus)"},{"name":"Fleetwood Mac","herCount":1,"himCount":1,"songs":["Oh Well, Pt. 1 - 2013 Remaster"],"trackId":"0QdagWnOd3GzMCBu57efgp","trackTitle":"Oh Well, Pt. 1 - 2013 Remaster"}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('festival-data').textContent);
const LS='festival-adam-natalia-v1';
const BUDGET=50, MAX=5;
const DEAD={Nirvana:'Kurt to bude musiet odhrat zo zahrobia, ale budgetovo to stale sedi.', 'Sonic Youth':'Sonic Youth reunion vybavime cez velmi presvedcivy plagat.', 'The Smiths':'Morrissey dostane vlastny stan pre dramaticke odchody.', 'Karel Kryl':'Karel pride ako legenda, maskot bude drzat sviecku.'};
let state=null;
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){const seed=String(Date.now())+'-'+Math.random();const r=mulberry32(hashSeed(seed));const counts=DATA.artists.map(a=>a.herCount+a.himCount);const min=Math.min(...counts),max=Math.max(...counts);const pricey=new Set(['Title Fight','Sonic Youth','Superheaven','Radiohead','Nirvana']);const prices={};DATA.artists.forEach(a=>{const power=(a.herCount+a.himCount-min)/(max-min||1);let p=6+Math.round(power*11)+Math.floor(r()*5);if(pricey.has(a.name))p=Math.max(p,16+Math.floor(r()*6));prices[a.name]=Math.min(22,Math.max(6,p))});state={seed,prices,order:shuffle(DATA.artists.map((_,i)=>i),r),index:0,lineup:[],rejected:[],current:null,done:false,date:'',last:''};save()}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!state||!state.prices)init()}
const euro=n=>n+' €';
const spent=()=>state.lineup.reduce((s,i)=>s+state.prices[DATA.artists[i].name],0);
const left=()=>BUDGET-spent();
const remaining=()=>state.order.slice(state.index);
const canAnyoneFit=()=>remaining().some(i=>state.prices[DATA.artists[i].name]<=left());
function restart(){if(confirm('Zacat odznova s novymi cenami a novym losom?')){localStorage.removeItem(LS);init();render()}}
function draw(){if(state.done)return;state.current=null;if(state.lineup.length>=MAX||!canAnyoneFit()){finish('Uz sa nikto nezmesti, zvysok budgetu ide na pivo.');return}const i=state.order[state.index++];const a=DATA.artists[i],price=state.prices[a.name];let ok=price<=left();let msg;if(ok){state.lineup.push(i);msg='Booknute, vitaj na plagate.';burst()}else{state.rejected.push(i);msg='Nezmestil sa, ide domov.'}state.current={i,ok,msg};state.last=msg;if(state.lineup.length>=MAX)finish('Lineup je plny, festival moze zacat.');else if(!canAnyoneFit())finish('Uz sa nikto dalsi nezmesti, zvysok budgetu ide na pivo.');save();render()}
function finish(msg){state.done=true;state.last=msg;save();burst()}
function updateDate(v){state.date=v;save()}
function burst(){['🐱','🐰','🐀','🐭','✦','♡'].forEach((e,k)=>{const n=document.createElement('div');n.className='confetti';n.textContent=e;n.style.setProperty('--x',(Math.cos(k)*120+(Math.random()*50-25))+'px');n.style.setProperty('--y',(Math.sin(k)*100-80-Math.random()*70)+'px');document.body.appendChild(n);setTimeout(()=>n.remove(),850)})}
function stats(){const pct=Math.min(100,Math.round(spent()/BUDGET*100));return `<div class="topbar"><div class="stat"><b>${euro(left())}</b><span>ostava</span></div><div class="stat"><b>${state.lineup.length} / ${MAX}</b><span>lineup</span></div><div class="stat"><b>${remaining().length}</b><span>v klobuku</span></div></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div>`}
function lineupHTML(){let html='<section class="card lineup"><div class="eyebrow">Lineup zatial</div>';for(let n=0;n<MAX;n++){const i=state.lineup[n];if(i===undefined)html+=`<div class="slot empty"><span class="num">${n+1}</span><span>volne miesto</span></div>`;else{const a=DATA.artists[i];html+=`<div class="slot"><span class="num">${n+1}</span><span><strong>${esc(a.name)}</strong><div class="mini">${esc((a.songs||[]).slice(0,2).join(', '))}</div></span><strong>${euro(state.prices[a.name])}</strong></div>`}}return html+'</section>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function intro(){return `<header><h1>Festival Adam × Natalia</h1><div class="sub">50 €, 28 spolocnych interpretov, 5 miest na plagate</div></header><section class="card hero fade"><div class="mascot"><div class="face">/ᐠ - ˕ -マ</div><div class="bubble">Los vytiahne interpreta a jeho honorar. Ked sa zmesti do budgetu, hned ide do lineup-u, ked nie, bali kabel a ide domov.</div></div><p>Ceny aj poradie su nahodne pri prvom spusteni a refresh ich nezmeni. Nikto dopredu nevie, kto vyjde.</p><button class="primary" onclick="draw()">Vylosuj prvu kapelu</button></section><div class="btns"><button onclick="restart()">Zacat odznova</button></div>`}
function currentCard(){if(!state.current)return `<section class="card hero"><div class="mascot"><div class="face">ᘛ⁐̤ᕐᐷ</div><div class="bubble">Klobuk je pripraveny. Klikni a uvidime, ci ostane aj na pivo.</div></div><button class="primary" onclick="draw()">Vylosuj</button></section>`;const a=DATA.artists[state.current.i],price=state.prices[a.name],fit=state.current.ok;const joke=DEAD[a.name]?`<div class="bubble">${DEAD[a.name]}</div>`:'';const embed=a.trackId?`<iframe loading="lazy" src="https://open.spotify.com/embed/track/${a.trackId}?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`:'';return `<section class="card draw-card reveal ${fit?'':'shake'}"><div class="eyebrow">Vylosovane</div><div class="artist-row"><div class="artist"><h2>${esc(a.name)}</h2><div class="mini">spolocna sila: Natalia ${a.herCount}, Adam ${a.himCount}</div></div><div class="price">${euro(price)}</div></div><div class="songs">${(a.songs||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div><div class="verdict ${fit?'yes':'no'}">${fit?'Zmesti sa do budgetu. ':'Budget hovori nie. '}${state.current.msg}</div>${joke}${embed}</section>`}
function play(){return `<header><h1>Festival Adam × Natalia</h1><div class="sub">bookujeme mini festival za 50 €</div></header>${stats()}<div class="draw-area">${currentCard()}${lineupHTML()}</div><div class="btns"><button class="primary" onclick="draw()">Vylosuj dalsie</button><button onclick="renderPoster()">Ukaz plagat</button><button class="danger" onclick="restart()">Zacat odznova</button></div>`}
function sortedLineup(){return [...state.lineup].sort((x,y)=>state.prices[DATA.artists[y].name]-state.prices[DATA.artists[x].name])}
function posterHTML(){const list=sortedLineup();const acts=list.map((i,n)=>{const a=DATA.artists[i],cls=n==0?'head':n<3?'mid':'small';return `<div class="poster-act ${cls}">${esc(a.name)}<div class="mini">honorar ${euro(state.prices[a.name])}</div></div>`}).join('');return `<section class="poster fade" id="poster"><h2>Festival<br>Adam × Natalia</h2><div class="datebox"><span>datum:</span><input value="${esc(state.date)}" oninput="updateDate(this.value)" placeholder="napr. 14. februar"></div><div class="poster-list">${acts}</div><div class="mini">budget ${euro(BUDGET)}, minutych ${euro(spent())}, zvysok ${euro(left())}</div><div class="bubble" style="margin:16px auto 0">${esc(state.last||'Hotovo. Screenshotni plagat a mozete bookovat obyvacku.')}</div></section><div class="btns"><button onclick="state.done=false;save();render()">Spat k losovaniu</button><button class="danger" onclick="restart()">Zacat odznova</button></div>`}
function renderPosterOnly(){const p=document.getElementById('poster');if(p)p.outerHTML=posterHTML().match(/<section[\s\S]*<\/section>/)[0]}
function renderPoster(){document.getElementById('app').innerHTML=posterHTML()}
function render(){load();document.getElementById('app').innerHTML=state.index===0&&state.lineup.length===0&&!state.current&&!state.done?intro():(state.done?posterHTML():play())}
render();
</script>
</body>
</html>
