<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>festival adam × natalinka</title>
<style>
:root{--bg:#0c0c0f;--text:#f2f0ea;--muted:#9a978f;--line:#33333b;--green:#58d68d;--pink:#ff6b9a;--yellow:#ffd166;--red:#ff6b6b;--blue:#6ea8ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(255,107,154,.13),transparent 36%),radial-gradient(circle at 82% 12%,rgba(110,168,255,.12),transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px;padding:22px 16px 44px}
header{text-align:center;margin:8px 0 16px}h1{font-size:clamp(30px,8vw,50px);font-weight:950;letter-spacing:-1.2px;text-transform:lowercase;line-height:.96}.sub{color:var(--muted);font-size:14px;margin-top:8px}
.card{background:linear-gradient(160deg,rgba(29,29,35,.96),rgba(13,13,16,.96));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.35);margin-bottom:14px}
.mascot{display:flex;gap:10px;align-items:flex-start}.face{font-size:24px;white-space:nowrap;flex-shrink:0}.bubble{background:#22222a;border:1px solid #3b3b45;border-radius:16px;padding:12px 14px;line-height:1.35;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.stat{background:rgba(22,22,27,.8);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.stat.adam b{color:var(--blue)}.stat.nat b{color:var(--pink)}
button{appearance:none;border:1px solid var(--line);background:#202028;color:var(--text);border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px;transition:transform .15s}button:active{transform:scale(.97)}button.primary{background:var(--text);color:#101014;border:0}button.adam{background:var(--blue);color:#0b1020;border:0}button.nat{background:var(--pink);color:#2a0b16;border:0}button.ghost{background:transparent}button:disabled{opacity:.35}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;margin-bottom:6px}
.artist{font-size:clamp(28px,8vw,42px);font-weight:950;line-height:1;letter-spacing:-.8px}.mini{font-size:12px;color:var(--muted);margin-top:4px}
.songs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.pill{border:1px solid #3a3a44;background:#24242c;border-radius:999px;padding:6px 10px;color:#d9d6ce;font-size:12px}
.bidbox{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.who{font-weight:900;font-size:18px;margin-bottom:8px}.who.adam{color:var(--blue)}.who.nat{color:var(--pink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}.stepper .val{font-size:44px;font-weight:950;min-width:110px;text-align:center}.stepper button{width:56px;height:56px;font-size:26px;padding:0;border-radius:50%}
.current{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);border-radius:14px;padding:10px 12px;text-align:center;font-weight:800;margin-bottom:8px}
.pop{animation:pop .28s ease}@keyframes pop{from{opacity:.2;transform:scale(.96)}to{opacity:1;transform:none}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lineup{display:flex;flex-direction:column;gap:6px}.slot{padding:8px 10px;font-size:13px}.slot{display:flex;gap:10px;align-items:center;background:#141418;border:1px solid #2d2d35;border-radius:14px;padding:10px 12px}.slot .tag{font-size:11px;font-weight:900;padding:4px 8px;border-radius:99px}.tag.adam{background:rgba(110,168,255,.2);color:var(--blue)}.tag.nat{background:rgba(255,107,154,.2);color:var(--pink)}.slot .n{flex:1;font-weight:800}.slot .p{color:var(--yellow);font-weight:900}.empty{color:#686862}
.poster.adam{background:linear-gradient(165deg,#12203a,#0e1420 62%,#101014)}.poster.nat{background:linear-gradient(165deg,#3a1226,#1f0e14 62%,#101014)}.vote{margin-bottom:14px}.poster{background:linear-gradient(165deg,#211629,#0e1420 62%,#101014);border:1px solid #3b3340;border-radius:24px;padding:22px;text-align:center;position:relative;overflow:hidden}.poster:before{content:"🐱  🐰  🐀  🐭";position:absolute;top:12px;left:50%;transform:translateX(-50%);opacity:.18;font-size:22px;letter-spacing:16px;white-space:nowrap}.poster h2{font-size:clamp(34px,10vw,58px);line-height:.9;text-transform:lowercase;letter-spacing:-1.4px;margin-top:28px}
.poster-list{display:flex;flex-direction:column;gap:8px;margin:16px 0}.act{border-radius:14px;padding:10px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}.act.head{font-size:clamp(28px,8vw,46px);font-weight:950;text-transform:uppercase}.act.mid{font-size:clamp(21px,6vw,32px);font-weight:900}.act.small{font-size:clamp(17px,4.5vw,22px);font-weight:850}
iframe{width:100%;height:80px;border:0;border-radius:12px;margin-top:10px}
.confetti{position:fixed;z-index:5;left:50%;top:46%;font-size:24px;pointer-events:none;animation:boom .8s ease forwards}@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(50deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="festival-data" type="application/json">{"artists":[{"name":"Title Fight","herCount":60,"himCount":67,"songs":["Numb, But I Still Feel It","In-Between","Liar's Love","Shed"],"trackId":"6BQcuknn21BEpig4PEPtD4","trackTitle":"Numb, But I Still Feel It"},{"name":"Sonic Youth","herCount":59,"himCount":34,"songs":["Shadow of a Doubt","Incinerate","Anagrama","Beautiful Plateau - Non-LP version"],"trackId":"0mYaDPgvNkXgXS3TVjuITD","trackTitle":"Shadow of a Doubt"},{"name":"Superheaven","herCount":21,"himCount":28,"songs":["I've Been Bored","Next To Nothing","Room","All the Pain"],"trackId":"3zi9xNpG2WHCdCAxV0BpJm","trackTitle":"I've Been Bored"},{"name":"Radiohead","herCount":6,"himCount":17,"songs":["Black Star","Fake Plastic Trees","Let Down","India Rubber"],"trackId":"6UO72VSXEONxdfLyABihs9","trackTitle":"Black Star"},{"name":"Nirvana","herCount":21,"himCount":4,"songs":["Clean Up Before She Comes - Solo Acoustic","All Apologies - Home Demo","Sliver - Solo Acoustic Demo","Rape Me - Solo Acoustic"],"trackId":"46m6dFnBEfdcGNwyEP2fBd","trackTitle":"Clean Up Before She Comes - Solo Acoustic"},{"name":"Hum","herCount":3,"himCount":24,"songs":["Stars","I Hate It Too","I'd Like Your Hair Long"],"trackId":"6lQE6LF3MU63Z6VyhPxaV3","trackTitle":"Stars"},{"name":"The Wilderness","herCount":25,"himCount":1,"songs":["Každý z nás je tak trochu Hiró Onoda","Nedlžím ti nič!","Čo s tým hnevom?","Juche (tɕutɕʰe)"],"trackId":"1qePNzqdiSzyMz5NDU0H4i","trackTitle":"Každý z nás je tak trochu Hiró Onoda"},{"name":"The Smiths","herCount":16,"himCount":3,"songs":["Unloveable - 2017 Master","This Night Has Opened My Eyes - 2011 Remaster","What Difference Does It Make? - John Peel Session 18/05/83","Shoplifters of the World Unite - 2011 Remaster"],"trackId":"14WNN9XlshGSckMBNcP6Ez","trackTitle":"Unloveable - 2017 Master"},{"name":"Deftones","herCount":22,"himCount":1,"songs":["Dai the Flu","Be Quiet and Drive (Far Away)","Mascara","Lotion"],"trackId":"2cN7qiHMJflO91pkG9HoO1","trackTitle":"Dai the Flu"},{"name":"Jaromir Nohavica","herCount":5,"himCount":7,"songs":["Pisen o manzelstvi","Stanice Jiřího Z Poděbrad - Live","U Nás Na Severu"],"trackId":"2sblDgy0L1RTxSXm32Vj1i","trackTitle":"Pisen o manzelstvi"},{"name":"Slowdive","herCount":16,"himCount":1,"songs":["Souvlaki Space Station","When the Sun Hits","40 Days","Machine Gun"],"trackId":"76JhicgPtW4zbN72tpnMyA","trackTitle":"Souvlaki Space Station"},{"name":"The Cure","herCount":16,"himCount":1,"songs":["Pictures Of You - Remastered","Lullaby - Remastered","Lovesong - Remastered","Disintegration - Remastered"],"trackId":"2o49Twc3qrNMOt8gq9W06L","trackTitle":"Pictures Of You - Remastered"},{"name":"Unwound","herCount":8,"himCount":3,"songs":["Demons Sing Love Songs","Off This Century","October All Over","Look a Ghost"],"trackId":"7Fx68xe5jmn8sCRm7aGOR4","trackTitle":"Demons Sing Love Songs"},{"name":"Pantera","herCount":14,"himCount":1,"songs":["Walk","This Love","10's","The Great Southern Trendkill"],"trackId":"7fcfNW0XxTWlwVlftzfDOR","trackTitle":"Walk"},{"name":"Small Town Life","herCount":7,"himCount":2,"songs":["Matchless Seal","Emptiness","Narrow Minds","Sarcasm"],"trackId":"7AmYKj16zTLMcMbRQX4eq9","trackTitle":"Matchless Seal"},{"name":"Porcupine Tree","herCount":9,"himCount":1,"songs":["Blackest Eyes - 2017 Remaster","Drown With Me","Lazarus","Arriving Somewhere But Not Here - 2017 Remaster"],"trackId":"5RYbKJ3psLCFGKEqyJ931Y","trackTitle":"Blackest Eyes - 2017 Remaster"},{"name":"The Smashing Pumpkins","herCount":1,"himCount":8,"songs":["Luna - 2011 Remaster"],"trackId":"5Q6Xzp25aXYxNJ4B6vBkcf","trackTitle":"Luna - 2011 Remaster"},{"name":"Horkýže Slíže","herCount":6,"himCount":1,"songs":["Banda tupých hláv","Vlak","L.A.G. Song","Brďokoky"],"trackId":"7Hi4Bi0YYONp1YhuP1fTv8","trackTitle":"Banda tupých hláv"},{"name":"Chevelle","herCount":1,"himCount":5,"songs":["Comfortable Liar"],"trackId":"412LyfktkgWKEn8kmKiyQe","trackTitle":"Comfortable Liar"},{"name":"LSD and the Search for God","herCount":5,"himCount":1,"songs":["Heaven","(I Don't Think That We Should) Take It Slow","Starting Over","This Time"],"trackId":"1La3oTBpUJztVxuwiPnjjj","trackTitle":"Heaven"},{"name":"Black Country, New Road","herCount":1,"himCount":4,"songs":["Basketball Shoes"],"trackId":"4ShVovnLIlObG43vwaCRkJ","trackTitle":"Basketball Shoes"},{"name":"Cherries & Therapy","herCount":4,"himCount":1,"songs":["Veď Kvety Kvitnú v Tvojom Náručí","Teplo Lásky","Mramorové Schody","Vločka"],"trackId":"6lfBhehLKJbfqTTLDGko9j","trackTitle":"Veď Kvety Kvitnú v Tvojom Náručí"},{"name":"Karel Kryl","herCount":4,"himCount":1,"songs":["Srdce A Kříž","Monika","Nehažte Kamení - Live","Podivná Ruleta"],"trackId":"0E2JXEDWBbCBKwnDu3hiOG","trackTitle":"Srdce A Kříž"},{"name":"Rod Stewart","herCount":1,"himCount":3,"songs":["Da Ya Think I'm Sexy? - 2008 Remaster"],"trackId":"2MRPFJIOChJbwNGKc9a77H","trackTitle":"Da Ya Think I'm Sexy? - 2008 Remaster"},{"name":"Richard Muller","herCount":1,"himCount":2,"songs":["Nocna optika"],"trackId":"7svPcHhXXzVDzBCTB7b0dd","trackTitle":"Nocna optika"},{"name":"Anita Soul","herCount":1,"himCount":1,"songs":["Ona Má šýl (feat. Anita Soul & Rytmus)"],"trackId":"5Nn5oeaHN5ws7MZ6sK2RBm","trackTitle":"Ona Má šýl (feat. Anita Soul & Rytmus)"},{"name":"Rytmus","herCount":1,"himCount":1,"songs":["Ona Má šýl (feat. Anita Soul & Rytmus)"],"trackId":"5Nn5oeaHN5ws7MZ6sK2RBm","trackTitle":"Ona Má šýl (feat. Anita Soul & Rytmus)"},{"name":"Fleetwood Mac","herCount":1,"himCount":1,"songs":["Oh Well, Pt. 1 - 2013 Remaster"],"trackId":"0QdagWnOd3GzMCBu57efgp","trackTitle":"Oh Well, Pt. 1 - 2013 Remaster"}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('festival-data').textContent);
const BUDGET=50, SLOTS=10, MINBID=2, STEP=1, LS='natalinka-festival-v2';
const P={adam:'Adam',nat:'Natalinka'};
const DEAD={Nirvana:'Kurt to odohra zo zahrobia.','Sonic Youth':'reunion vybavime plagatom.','The Smiths':'Morrissey dostane vlastny stan na odchody.','Karel Kryl':'legenda, maskot drzi sviecku.'};
let state=null;
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,t|1);r^=r+Math.imul(r^r>>>7,r|61);return((r^r>>>14)>>>0)/4294967296}}
function shuffle(a,seed){const r=rng(seed);a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(LS))}catch(e){state=null}}
function fresh(first){const seed=Date.now()%2147483647;state={seed,order:shuffle(DATA.artists.map((a,i)=>i),seed),pos:0,budget:{adam:BUDGET,nat:BUDGET},lineup:[],drawer:first,phase:'draw',cur:null,bid:0,bidder:null,pass:0,done:false,log:[]};save();render()}
function left(w){return state.budget[w||state.turn]}
function other(w){return w==='adam'?'nat':'adam'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function euro(n){return n+' €'}
function draw(){if(state.pos>=state.order.length){finish('kapely dosli');return}state.cur=state.order[state.pos++];state.phase='bid';state.bid=0;state.bidder=null;state.turn=state.drawer;state.amount=Math.min(MINBID,left(state.turn));save();render()}
function setAmount(d){state.amount=Math.max(state.bid?state.bid+STEP:MINBID,Math.min(left(state.turn),state.amount+d));render()}
function placeBid(){if(state.amount>left(state.turn)||state.amount<=state.bid)return;state.bid=state.amount;state.bidder=state.turn;state.turn=other(state.turn);state.amount=Math.min(left(state.turn),state.bid+STEP);save();render()}
function pass(){ if(state.bidder===null){ // prvy hrac nechce vobec
    state.turn=other(state.turn); if(state.turn===state.drawer){ skip('nikto nechcel'); return } render(); return }
  award() }
function award(){const a=DATA.artists[state.cur];state.lineup.push({i:state.cur,by:state.bidder,price:state.bid});state.budget[state.bidder]-=state.bid;state.log.push(`${P[state.bidder]} bookol ${a.name} za ${state.bid} €`);burst();next()}
function skip(why){const a=DATA.artists[state.cur];state.log.push(`${a.name}: ${why}`);next()}
function next(){state.drawer=other(state.drawer);state.phase='draw';state.cur=null;state.bid=0;state.bidder=null;if(state.lineup.length>=SLOTS)return finish('lineup plny');if(left('adam')<MINBID&&left('nat')<MINBID)return finish('obom dosiel budget');save();render()}
function finish(why){state.done=true;state.why=why;save();render()}
function restart(){if(confirm('Zacat odznova?')){localStorage.removeItem(LS);state=null;render()}}
function burst(){const em=['🐱','🐰','🐀','🐭','🎸','✨'];for(let i=0;i<14;i++){const e=document.createElement('div');e.className='confetti';e.textContent=em[i%em.length];e.style.setProperty('--x',(Math.random()*360-180)+'px');e.style.setProperty('--y',(Math.random()*300-260)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),900)}}
function stats(){const ac=state.lineup.filter(x=>x.by==='adam').length,nc=state.lineup.filter(x=>x.by==='nat').length;return `<div class="stats"><div class="stat adam"><b>${left('adam')} €</b><span>adam · ${ac} kapely</span></div><div class="stat nat"><b>${left('nat')} €</b><span>natalinka · ${nc} kapely</span></div></div>`}
function col(w){const rows=state.lineup.filter(x=>x.by===w).map(x=>`<div class="slot"><span class="n">${esc(DATA.artists[x.i].name)}</span><span class="p">${x.price} €</span></div>`).join('')||'<div class="slot empty"><span class="n">zatial nic</span></div>';return `<div><div class="who ${w}" style="font-size:14px">${P[w]}</div><div class="lineup">${rows}</div></div>`}
function lineupHTML(){return `<div class="card"><div class="eyebrow">lineupy · ${state.lineup.length} / ${SLOTS} kapiel</div><div class="cols">${col('adam')}${col('nat')}</div></div>`}
function intro(){return `<header><h1>festival adam × natalinka</h1><div class="sub">kazdy 50 €, spolu 10 kapiel, kazdy svoj plagat</div></header><div class="card"><div class="mascot"><div class="face">/ᐠ - ˕ -マ</div><div class="bubble">Vylosuje sa nahodna kapela. Kto losoval, da prvy bid. Druhy prihodi alebo necha. Kto da viac, ma kapelu na svojom plagate a plati zo svojich 50 €. Po 10 kapelach sa plagaty porovnaju.</div></div><div class="btns"><span style="width:100%;text-align:center;color:var(--muted);font-size:13px">kto losuje prvy?</span><button class="adam" onclick="fresh('adam')">Adam</button><button class="nat" onclick="fresh('nat')">Natalinka</button></div></div>`}
function drawScreen(){return `<header><h1>festival adam × natalinka</h1></header>${stats()}<div class="card pop"><div class="current">losuje <span class="who ${state.drawer}" style="display:inline">${P[state.drawer]}</span></div><div class="btns"><button class="primary ${state.drawer}" onclick="draw()">vylosovat kapelu</button></div></div>${lineupHTML()}<div class="btns"><button class="ghost" onclick="restart()">zacat odznova</button></div>`}
function bidScreen(){const a=DATA.artists[state.cur];const joke=DEAD[a.name]?`<div class="mini">${DEAD[a.name]}</div>`:'';const embed=a.trackId?`<iframe loading="lazy" src="https://open.spotify.com/embed/track/${a.trackId}?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`:'';
  const canBid=state.amount<=left(state.turn)&&state.amount>state.bid&&left(state.turn)>state.bid;
  const status=state.bidder?`<div class="current">najvyssi bid: <span class="who ${state.bidder}" style="display:inline">${P[state.bidder]}</span> ${state.bid} €</div>`:`<div class="current">zatial bez bidu</div>`;
  const passLabel=state.bidder?`nechat ${P[state.bidder]}`:'nechcem';const broke=left(state.turn)<=state.bid?`<div class="mini">${P[state.turn]} uz nema na prihodenie</div>`:'';
  return `<header><h1>festival adam × natalinka</h1></header>${stats()}<div class="card pop"><div class="eyebrow">vylosovane</div><div class="artist">${esc(a.name)}</div><div class="mini">natalinka ${a.herCount} songov, adam ${a.himCount}</div>${joke}<div class="songs">${(a.songs||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>${embed}
  <div class="bidbox">${status}<div class="who ${state.turn}">${P[state.turn]} na rade, ma ${left(state.turn)} €</div>${broke}<div class="stepper"><button onclick="setAmount(-${STEP})">−</button><div class="val">${state.amount} €</div><button onclick="setAmount(${STEP})">+</button></div><div class="btns"><button class="${state.turn}" onclick="placeBid()" ${canBid?'':'disabled'}>${state.bidder?'prihodit':'dat bid'} ${state.amount} €</button><button class="ghost" onclick="pass()">${passLabel}</button></div></div></div>${lineupHTML()}`}
function poster(w){const list=state.lineup.filter(x=>x.by===w).sort((a,b)=>b.price-a.price);const acts=list.map((x,n)=>`<div class="act ${n==0?'head':n<3?'mid':'small'}">${esc(DATA.artists[x.i].name)}<div class="mini">${x.price} €</div></div>`).join('')||'<div class="act small">prazdny plagat</div>';const sum=list.reduce((a,x)=>a+x.price,0);return `<div class="poster pop ${w}"><h2>festival<br>${P[w].toLowerCase()}</h2><div class="poster-list">${acts}</div><div class="mini">${list.length} kapiel · minute ${sum} € · zvysok ${left(w)} € na pivo</div></div>`}
function posterScreen(){const a=state.lineup.filter(x=>x.by==='adam').length,n=state.lineup.filter(x=>x.by==='nat').length;
  return `<header><h1>ktory festival je lepsi?</h1><div class="sub">${esc(state.why)} · adam ${a} kapiel, natalinka ${n} kapiel</div></header><div class="vote" id="vote">${voteHTML()}</div>${poster('adam')}<div style="height:14px"></div>${poster('nat')}<div class="card" style="margin-top:14px"><div class="eyebrow">ako to islo</div>${state.log.map(l=>`<div class="mini">${esc(l)}</div>`).join('')}</div><div class="btns"><button onclick="restart()">novy festival</button></div>`}
function voteHTML(){const v=state.votes||{};const done=v.adam&&v.nat;if(done){const same=v.adam===v.nat;return `<div class="card"><div class="current">${same?`zhoda: lepsi je festival <span class="who ${v.adam}" style="display:inline">${P[v.adam]}</span>`:'remiza, kazdy hlasoval inak. rozhodne to pivo.'}</div><div class="mini" style="text-align:center">adam hlasoval za ${P[v.adam].toLowerCase()}, natalinka za ${P[v.nat].toLowerCase()}</div></div>`}const who=v.adam?'nat':'adam';return `<div class="card"><div class="who ${who}">${P[who]}, ktory plagat je lepsi?</div><div class="btns"><button class="adam" onclick="vote('${who}','adam')">adamov</button><button class="nat" onclick="vote('${who}','nat')">natalinkin</button></div></div>`}
function vote(who,pick){state.votes=state.votes||{};state.votes[who]=pick;save();render()}
function render(){const app=document.getElementById('app');if(!state)return app.innerHTML=intro();if(state.done)return app.innerHTML=posterScreen();app.innerHTML=state.phase==='draw'?drawScreen():bidScreen();window.scrollTo({top:0})}
load();render();
</script>
</body>
</html>
