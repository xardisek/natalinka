<head>
<meta charset="UTF-8">

<title>Kvíz pre Natálku</title>
<style>
:root{--bg:#0c0c0f;--text:#f2f0ea;--muted:#9a978f;--card:#16161b;--line:#2b2b33;--pink:#ff6b9a;--green:#55d47b;--red:#ff6565;--blue:#7c8cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 20% 0%,rgba(124,140,255,.14),transparent 34%),radial-gradient(circle at 90% 15%,rgba(255,107,154,.13),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:720px;padding:22px 16px 42px;position:relative;z-index:1}
.bg-heart{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(13px,2.6vw,22px);line-height:1.12;color:#ff6b81;opacity:.07;text-shadow:0 0 34px rgba(255,107,129,.55);white-space:pre;pointer-events:none;user-select:none;z-index:0;animation:heartbeat 7s ease-in-out infinite}
@keyframes heartbeat{0%,100%{opacity:.055;transform:translateX(-50%) scale(1)}50%{opacity:.11;transform:translateX(-50%) scale(1.035)}}
header{text-align:center;margin:10px 0 18px}h1{font-size:clamp(29px,8vw,48px);font-weight:950;letter-spacing:-1px;text-transform:uppercase;line-height:.95}.sub{color:var(--muted);font-size:14px;margin-top:8px}
.panel,.question-card,.reward-card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 54px rgba(0,0,0,.38)}
.panel{padding:18px;text-align:center;display:grid;gap:14px}.panel p{color:var(--muted);line-height:1.5}.mascot{display:inline-flex;align-items:center;gap:8px;color:#f8dfe8;background:rgba(255,107,154,.13);border:1px solid rgba(255,107,154,.22);border-radius:999px;padding:8px 12px;font-size:13px;justify-self:center}
button{background:#1d1d23;color:var(--text);border:1px solid #33333b;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:750;cursor:pointer;transition:transform .14s ease,background .14s ease,border-color .14s ease}button:hover{background:#282830}button:active{transform:scale(.985)}button.primary{background:var(--text);color:#111;border:0;font-weight:900;padding:14px 24px}button.ghost{color:var(--muted);font-size:13px;padding:9px 12px}
.topbar{display:grid;gap:9px;margin-bottom:14px}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.bar{height:7px;background:#1d1d23;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7c8cff,#55d47b,#ffcf5b);transition:width .35s ease}
.question-card{padding:18px;display:grid;gap:15px}.pill{display:inline-flex;width:max-content;max-width:100%;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#c9c6be;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 10px}.q{font-size:clamp(21px,5.4vw,31px);font-weight:900;line-height:1.12;letter-spacing:-.4px}.hint{color:var(--muted);font-size:13px;line-height:1.35}
.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#15151a}.answer.correct{background:rgba(85,212,123,.16);border-color:rgba(85,212,123,.7)}.answer.wrong{background:rgba(255,101,101,.16);border-color:rgba(255,101,101,.7)}.answer[disabled]{cursor:default;opacity:.96}.mark{font-size:18px}
.feedback{min-height:44px;color:#f7e9ef;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:9px;line-height:1.35;font-size:14px;opacity:0;transform:translateY(6px);transition:.22s ease}.feedback.show{opacity:1;transform:none}
.spotify{border-radius:12px;overflow:hidden;background:#111;min-height:80px}iframe{display:block;width:100%;border:0}
.rewards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.reward-dot{border-radius:12px;background:#15151a;border:1px solid var(--line);padding:8px 5px;text-align:center;color:#777;font-size:18px}.reward-dot.unlocked{color:#111;background:linear-gradient(135deg,#ffcf5b,#ff8db3);border:0;animation:pop .28s ease}@keyframes pop{50%{transform:scale(1.12)}}
.reward-card{padding:16px;margin:14px 0;display:none;gap:8px;animation:slide .28s ease}.reward-card.show{display:grid}.reward-card b{font-size:18px}@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.end{display:grid;gap:14px}.reward-list{display:grid;gap:9px;text-align:left}.reward-item{background:#15151a;border:1px solid var(--line);border-radius:14px;padding:12px 13px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:5px}.tiny{font-size:12px;color:var(--muted);line-height:1.4}.confetti{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:10}.piece{position:absolute;font-size:22px;animation:fall 900ms ease forwards}@keyframes fall{to{transform:translateY(110px) rotate(35deg);opacity:0}}
footer{color:#55534d;font-size:11px;margin:auto 0 16px;text-align:center;position:relative;z-index:1}@media(min-width:640px){.question-card,.panel{padding:24px}.answers{grid-template-columns:1fr 1fr}}
</style>

<script>
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const CONFIG=JSON.parse(document.getElementById('quiz-config').textContent);
const LS='natalia-quiz-v1';
let state, questions=[];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniq(a){return [...new Set(a.filter(Boolean))]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function joinArtists(a){return (a||[]).join(', ')}
function makeQuestions(){
 const r=rng(CONFIG.seed||61813), pls=DATA.playlists, names=pls.map(p=>p.name), flat=[];
 pls.forEach(p=>p.tracks.forEach(t=>flat.push({...t,playlist:p.name,playlistSize:p.tracks.length})));
 const idCount={}, titleArtistCount={}; flat.forEach(t=>{idCount[t.id]=(idCount[t.id]||0)+1; const k=t.title+'|'+joinArtists(t.artists); titleArtistCount[k]=(titleArtistCount[k]||0)+1});
 const uniqueTracks=shuffle(flat.filter(t=>idCount[t.id]===1 && titleArtistCount[t.title+'|'+joinArtists(t.artists)]===1),r);
 const topAlbumsByArtist={}; flat.forEach(t=>{const a=t.artists&&t.artists[0]; if(a) (topAlbumsByArtist[a]||(topAlbumsByArtist[a]=new Set())).add(t.album)});
 const albumCandidates=shuffle(flat.filter(t=>t.album && t.artists&&t.artists[0] && topAlbumsByArtist[t.artists[0]] && topAlbumsByArtist[t.artists[0]].size>=4),r);
 const qs=[];
 const add=q=>{qs.push(q)};
 function opts(correct, arr){let o=uniq([correct,...shuffle(arr.filter(x=>x!==correct),r)]).slice(0,4); return shuffle(o,r)}
 let t=uniqueTracks[0]; add({type:'song-playlist',song:t,question:`V ktorom TVOJOM playliste je song „${t.title}“?`,answer:t.playlist,options:opts(t.playlist,names),note:`${joinArtists(t.artists)} býva v „${t.playlist}“.`,embed:t.id});
 let pl=shuffle(pls.filter(p=>p.tracks.length>=10),r)[0]; let inside=new Set(pl.tracks.map(t=>t.id)); let outsider=shuffle(flat.filter(t=>!inside.has(t.id)),r)[0]; add({type:'not-in',question:`Ktorý z týchto songov NIE JE v playliste „${pl.name}“?`,answer:outsider.title,options:opts(outsider.title,pl.tracks.slice(0,3).map(t=>t.title)),note:`Votrelec je „${outsider.title}“, ten je v „${outsider.playlist}“.`});
 pl=shuffle(pls.filter(p=>p.tracks.length>5),r)[1]; let nums=uniq([pl.tracks.length,pl.tracks.length+3,Math.max(1,pl.tracks.length-4),pl.tracks.length+7]); add({type:'count',question:`Koľko songov má playlist „${pl.name}“?`,answer:String(pl.tracks.length),options:shuffle(nums.map(String).slice(0,4),r),note:`Presne ${pl.tracks.length} songov, krysa počítala dvakrát.`});
 let top=DATA.top_artists[0][0]; add({type:'top-artist',question:'Ktorý interpret má v tvojich playlistoch najviac songov?',answer:top,options:opts(top,DATA.top_artists.slice(1,8).map(x=>x[0])),note:`Vyhráva ${top}, spolu ${DATA.top_artists[0][1]} songov.`});
 t=albumCandidates[0]; let alts=uniq([...topAlbumsByArtist[t.artists[0]]]); add({type:'album',song:t,question:`Z ktorého albumu je song „${t.title}“?`,answer:t.album,options:opts(t.album,alts),note:`Je to album „${t.album}“ od ${t.artists[0]}.`,embed:t.id});
 let multi=DATA.songs_in_multiple[0]; add({type:'multiple',question:'Ktorý song máš vo VIACERÝCH playlistoch?',answer:multi.title,options:opts(multi.title,uniqueTracks.slice(1,12).map(t=>t.title)),note:`„${multi.title}“ je vo viac playlistoch, napríklad ${multi.playlists.slice(0,2).join(' a ')}.`});
 let byLen=shuffle(pls,r).slice(0,7); let longest=[...byLen].sort((a,b)=>b.tracks.length-a.tracks.length)[0]; add({type:'longest',question:'Ktorý z týchto playlistov je najdlhší?',answer:longest.name,options:opts(longest.name,byLen.map(p=>p.name)),note:`„${longest.name}“ má ${longest.tracks.length} songov.`});
 byLen=shuffle(pls.filter(p=>p.tracks.length>1),r).slice(0,7); let shortest=[...byLen].sort((a,b)=>a.tracks.length-b.tracks.length)[0]; add({type:'shortest',question:'Ktorý z týchto playlistov je najkratší?',answer:shortest.name,options:opts(shortest.name,byLen.map(p=>p.name)),note:`„${shortest.name}“ má len ${shortest.tracks.length} songov.`});
 pl=shuffle(pls.filter(p=>p.tracks.length>=5),r)[2]; let first=pl.tracks.find(t=>t.pos===1)||pl.tracks[0]; add({type:'first',song:first,question:`Ktorý song je v playliste „${pl.name}“ na prvom mieste?`,answer:first.title,options:opts(first.title,pl.tracks.slice(1,8).map(t=>t.title)),note:`Prvý je „${first.title}“.`,embed:first.id});
 add({type:'common-count',question:'Koľko interpretov máte s Adamom spoločných?',answer:String(DATA.common_artist_count),options:shuffle([DATA.common_artist_count,DATA.common_artist_count-5,DATA.common_artist_count+7,DATA.common_artist_count+12].map(String),r),note:`Je ich ${DATA.common_artist_count}. Celkom slušný hudobný pakt.`});
 let cs=DATA.common_songs.find(s=>s.her_playlist==='vraj som nula a vraj som luzer' && s.him_source==='Liked Songs') || DATA.common_songs.find(s=>s.her_playlist==='vraj som nula a vraj som luzer') || DATA.common_songs[0]; add({type:'common-song',song:cs,question:'Ktorý spoločný song je v tvojom „vraj som nula a vraj som luzer“ aj v Adamových Liked Songs?',answer:cs.title,options:opts(cs.title,DATA.common_songs.filter(s=>s.title!==cs.title).map(s=>s.title)),note:`Áno, „${cs.title}“ poznáte obaja.`,embed:cs.id});
 t=uniqueTracks[5]; add({type:'song-playlist',song:t,question:`V ktorom TVOJOM playliste je song „${t.title}“?`,answer:t.playlist,options:opts(t.playlist,names),note:`Toto býva v „${t.playlist}“.`,embed:t.id});
 t=albumCandidates[4]; alts=uniq([...topAlbumsByArtist[t.artists[0]]]); add({type:'album',song:t,question:`Z ktorého albumu je song „${t.title}“?`,answer:t.album,options:opts(t.album,alts),note:`Album je „${t.album}“.`,embed:t.id});
 let top3=DATA.top_artists.slice(0,3).map(x=>x[0]).join(' / '); add({type:'top3',question:'Aké je poradie tvojich TOP 3 interpretov podľa počtu songov?',answer:top3,options:opts(top3,[DATA.top_artists.slice(1,4).map(x=>x[0]).join(' / '), DATA.top_artists.slice(0,3).map(x=>x[0]).reverse().join(' / '), [DATA.top_artists[0][0],DATA.top_artists[2][0],DATA.top_artists[1][0]].join(' / ')]),note:`Top trojka je ${top3}.`});
 pl=shuffle(pls.filter(p=>p.tracks.length>=8),r)[5]; inside=new Set(pl.tracks.map(t=>t.id)); outsider=shuffle(flat.filter(t=>!inside.has(t.id)),r)[3]; add({type:'not-in',question:`Ktorý z týchto songov NIE JE v playliste „${pl.name}“?`,answer:outsider.title,options:opts(outsider.title,pl.tracks.slice(0,4).map(t=>t.title)),note:`„${outsider.title}“ tam nie je. Malý potkan našiel dieru.`});
 // rezervný pool (použije sa len ak CONFIG.questionCount > 15)
 for(const k of [8,11,14]){ t=uniqueTracks[k]; if(t) add({type:'song-playlist',song:t,question:`V ktorom TVOJOM playliste je song „${t.title}“?`,answer:t.playlist,options:opts(t.playlist,names),note:`Toto býva v „${t.playlist}“.`,embed:t.id}); }
 for(const k of [7,10]){ t=albumCandidates[k]; if(t){ alts=uniq([...topAlbumsByArtist[t.artists[0]]]); add({type:'album',song:t,question:`Z ktorého albumu je song „${t.title}“?`,answer:t.album,options:opts(t.album,alts),note:`Album je „${t.album}“.`,embed:t.id}); } }
 for(const k of [3,4]){ pl=shuffle(pls.filter(p=>p.tracks.length>5),r)[k]; if(pl){ nums=uniq([pl.tracks.length,pl.tracks.length+2,Math.max(1,pl.tracks.length-3),pl.tracks.length+6]); add({type:'count',question:`Koľko songov má playlist „${pl.name}“?`,answer:String(pl.tracks.length),options:shuffle(nums.map(String),r),note:`Presne ${pl.tracks.length}.`}); } }
 return qs.slice(0, CONFIG.questionCount||15);
}
function fresh(){questions=makeQuestions();state={i:0,score:0,answered:false,picks:[],unlocked:JSON.parse(localStorage.getItem(LS+'-unlocked')||'[]'),done:false};save()}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(LS));}catch(e){} questions=makeQuestions(); if(!state||!Array.isArray(state.picks)) state=null}
function currentRewards(){return CONFIG.rewards.map((name,i)=>({name,threshold:CONFIG.rewardThresholds[i]||((i+1)*3)})).filter(r=>r.threshold<=(CONFIG.questionCount||15))}
function unlockedNow(){return currentRewards().filter(r=>state.unlocked.includes(r.threshold))}
function renderStart(){document.getElementById('app').innerHTML=`<header><h1>Playlistový kvíz</h1><div class="sub">15 otázok o tvojich playlistoch</div></header><section class="panel"><span class="mascot">/ᐠ - ˕ -マ <b>${CONFIG.questionCount} otázok, ${currentRewards().length} odmien</b></span><p>Odmeny za 5, 10 a 15 správnych.</p><button class="primary" onclick="fresh();render()">Začať kvíz</button><button class="ghost" onclick="resetAll()">vymazať uložený stav</button></section>`}
function render(){if(!state) return renderStart(); if(state.done||state.i>=questions.length) return renderEnd(); const q=questions[state.i]; const pct=Math.round(state.i/questions.length*100); document.getElementById('app').innerHTML=`<header><h1>Playlistový kvíz</h1></header><div class="topbar"><div class="stats"><span>otázka ${state.i+1} / ${questions.length}</span><span>${state.score} správne</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>${rewardDots()}<section class="question-card"><div class="q">${esc(q.question)}</div>${state.answered&&q.embed?embed(q.embed):''}<div class="answers">${q.options.map((o,idx)=>answerButton(o,q,idx)).join('')}</div><div class="feedback ${state.answered?'show':''}">${state.answered?feedback(q):''}</div><div class="actions">${state.answered?`<button class="primary" onclick="nextQ()">${state.i===questions.length-1?'výsledok':'ďalšia otázka'}</button>`:''}<button class="ghost" onclick="restart()">začať odznova</button></div></section><div class="reward-card" id="reward-pop"></div>`}
function label(t){return {'song-playlist':'playlist detektív','not-in':'votrelec','count':'počítanie','top-artist':'top interpret','album':'album stopa','multiple':'core song','longest':'najdlhší playlist','shortest':'najkratší playlist','first':'prvý song','common-count':'spoločné veci','common-song':'spoločný song','top3':'top trojka'}[t]||'otázka'}
function answerButton(o,q,idx){let cls='answer', mark=''; if(state.answered){if(o===q.answer){cls+=' correct';mark='✓'} else if(o===state.picks[state.i]){cls+=' wrong';mark='×'}} return `<button class="${cls}" ${state.answered?'disabled':''} onclick="chooseIndex(${idx})"><span>${esc(o)}</span><span class="mark">${mark}</span></button>`}
function chooseIndex(idx){choose(questions[state.i].options[idx])}
function feedback(q){const ok=state.picks[state.i]===q.answer; return ok?'🐱 správne':'🐭 nesprávne'}
function embed(id){return `<div class="spotify"><iframe loading="lazy" src="https://open.spotify.com/embed/track/${encodeURIComponent(id)}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>`}
function rewardDots(){return `<div class="rewards">${currentRewards().map(r=>`<div class="reward-dot ${state.unlocked.includes(r.threshold)?'unlocked':''}">${state.unlocked.includes(r.threshold)?'🔓':'🔒'}<div class="tiny">${r.threshold}</div></div>`).join('')}</div>`}
function choose(ans){if(state.answered)return; const q=questions[state.i]; state.picks[state.i]=ans; state.answered=true; if(ans===q.answer){state.score++; const r=currentRewards().find(x=>x.threshold===state.score); if(r&&!state.unlocked.includes(r.threshold)){state.unlocked.push(r.threshold); localStorage.setItem(LS+'-unlocked',JSON.stringify(state.unlocked)); save(); render(); setTimeout(()=>showReward(r),120); return}} save(); render()}
function showReward(r){const el=document.getElementById('reward-pop'); if(!el||!r)return; el.className='reward-card show'; el.innerHTML=`<b>🔓 ${esc(r.name)}</b>`; confetti()}
function nextQ(){if(!state.answered)return; state.i++; state.answered=false; if(state.i>=questions.length){state.done=true} save(); render()}
function renderEnd(){const pct=Math.round(state.score/questions.length*100); document.getElementById('app').innerHTML=`<header><h1>Výsledok</h1><div class="sub">${state.score} / ${questions.length}</div></header><section class="panel end"><span class="mascot">ᘛ⁐̤ᕐᐷ <b>odmeny</b></span><div class="reward-list">${unlockedNow().length?unlockedNow().map(r=>`<div class="reward-item">🔓 ${esc(r.name)}</div>`).join(''):'<div class="reward-item">žiadna</div>'}</div><div class="actions"><button class="primary" onclick="restart()">znova</button><button class="ghost" onclick="resetAll()">vymazať všetko</button></div></section>`}
function restart(){fresh();render()}
function resetAll(){localStorage.removeItem(LS);localStorage.removeItem(LS+'-unlocked');state=null;renderStart()}
function confetti(){const c=document.getElementById('confetti'), e=['🐱','🐰','🐀','✨','💿']; c.innerHTML=''; for(let i=0;i<18;i++){const s=document.createElement('span');s.className='piece';s.textContent=e[i%e.length];s.style.left=(10+Math.random()*80)+'%';s.style.top=(18+Math.random()*20)+'%';s.style.animationDelay=(Math.random()*180)+'ms';c.appendChild(s)} setTimeout(()=>c.innerHTML='',1200)}
load();render();
window.__quizQuestions=()=>makeQuestions().map((q,i)=>({i:i+1,type:q.type,question:q.question,answer:q.answer,options:q.options}));
</script>
</body></html>
