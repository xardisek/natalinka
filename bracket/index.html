<script>
const DATA=JSON.parse(document.getElementById('bracket-data').textContent);const LS='natalia-song-bracket-v1',HLS='natalia-song-bracket-history-v1';let state=null;const app=document.getElementById('app');
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}function hue(s){return hash(s)%360}function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,t|1);r^=r+Math.imul(r^r>>>7,r|61);return((r^r>>>14)>>>0)/4294967296}}function shuffle(a,seed){let r=rng(seed);a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(LS,JSON.stringify(state))}function load(){try{state=JSON.parse(localStorage.getItem(LS))}catch(e){state=null}}function histories(){try{return JSON.parse(localStorage.getItem(HLS))||[]}catch(e){return[]}}function saveHist(item){let h=histories();h.unshift(item);localStorage.setItem(HLS,JSON.stringify(h.slice(0,5)))}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function modeName(m){return m==='core'?'natalinka core':m==='common'?'spolocne':'playlist'}function totalPicks(){return state.entrants.length-1}function currentPair(){return [state.current[state.pairIdx*2],state.current[state.pairIdx*2+1]]}
function start(mode,tracks,playlistName){let seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;let entrants=shuffle(tracks,seed).slice(0,mode==='playlist'?16:32);state={mode,playlistName:playlistName||'',seed,entrants,current:entrants,next:[],round:0,pairIdx:0,picks:0,snaps:[],losersByRound:[],openEmbed:null,finished:false};save();render()}
function snap(){let {snaps,...rest}=state;return JSON.stringify(rest)}function pick(i){let [a,b]=currentPair(),winner=i===0?a:b,loser=i===0?b:a;state.snaps.push(snap());if(state.snaps.length>40)state.snaps.shift();(state.losersByRound[state.round] ||= []).push(loser);state.next.push(winner);state.picks++;state.pairIdx++;if(state.pairIdx>=state.current.length/2){if(state.next.length===1){state.finished=true;finish()}else{state.current=state.next;state.next=[];state.pairIdx=0;state.round++}}save();render()}
function undo(){if(!state?.snaps?.length)return;if(state.savedResult){let h=histories();h.shift();localStorage.setItem(HLS,JSON.stringify(h))}let snaps=state.snaps;state=JSON.parse(snaps.pop());state.snaps=snaps;state.savedResult=false;save();render()}function restart(){if(confirm('Zacat odznova?')){localStorage.removeItem(LS);state=null;render()}}
function finish(){if(state.savedResult)return;let winner=state.next[0], finalLosers=state.losersByRound[state.round]||[], semi=state.losersByRound[state.round-1]||[];state.savedResult=true;saveHist({date:new Date().toLocaleDateString('sk-SK'),mode:modeName(state.mode),playlist:state.playlistName,winner:winner.title,finalist:finalLosers[0]?.title||'',semis:semi.map(s=>s.title)});burst()}
function toggleEmbed(id,ev){ev.stopPropagation();state.openEmbed=state.openEmbed===id?null:id;save();render()}function embed(id){return `https://open.spotify.com/embed/track/${encodeURIComponent(id)}?utm_source=generator&theme=0`}
function songCard(s,idx){return `<article class="card songcard fade" style="--h:${hue(s.artist)}" onclick="pick(${idx})"><span class="pill">${esc(s.album||'album')}</span><div><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div><div class="meta">z jej playlistu: ${esc(s.playlist)}</div><button class="play" onclick="toggleEmbed('${esc(s.id)}',event)">▶ pripomenut song</button>${state.openEmbed===s.id?`<iframe title="Spotify ukazka" loading="lazy" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" src="${embed(s.id)}"></iframe>`:''}</article>`}
function renderStart(){let h=histories().map(x=>`<div class="hist">${esc(x.date)} · ${esc(x.mode)}${x.playlist?' · '+esc(x.playlist):''} · vyhralo: <b>${esc(x.winner)}</b></div>`).join('')||'<div class="hist">Zatial ziadna historia, krysa caka na prvy finalovy chaos.</div>';app.innerHTML=`<header><h1>natalinka song bracket</h1><div class="sub">Natálkine playlisty, Adamove klikanie, zvieratka dozorujú</div></header><section class="panel bubble"><div class="pet">/ᐠ - ˕ -マ</div><div>Vyber rezim. Klik na kartu posunie song dalej, tlacidlo ▶ otvori Spotify mini prehravac.</div></section><section class="modes"><button class="mode" onclick="start('core',DATA.core)"><b>natalinka core, 32 songov</b><span>Songy, ktore sa jej vracaju vo viacerych playlistoch.</span></button><button class="mode" onclick="start('common',DATA.common)"><b>spolocne, 32 songov</b><span>Presne tie tracky, ktore mate obaja ulozene alebo v playlistoch.</span></button><button class="mode" onclick="renderPlaylistPick()"><b>nahodnych 16 z playlistu</b><span>Vyber jeden jej playlist a bracket sa vylosuje z neho.</span></button></section><section class="panel"><div class="bubble"><div class="pet">ᘛ⁐̤ᕐᐷ</div><div>Posledne vysledky</div></div><div class="history">${h}</div></section>`}
function renderPlaylistPick(){let opts=DATA.playlists.map((p,i)=>`<option value="${i}">${esc(p.name)} (${p.count})</option>`).join('');app.innerHTML=`<header><h1>natalinka song bracket</h1><div class="sub">16 nahodnych songov z jedneho miesta</div></header><section class="panel"><label for="pl">Vyber playlist</label><select id="pl">${opts}</select><div class="controls"><button class="ghost" onclick="renderStart()">spat</button><button class="primary" onclick="let p=DATA.playlists[document.getElementById('pl').value];start('playlist',p.tracks,p.name)">vylosovat bracket</button></div></section>`}
function renderGame(){let [a,b]=currentPair(),pct=Math.round(state.picks/totalPicks()*100),roundNames=['Prve kolo','Osemfinale','Stvrtfinale','Semifinale','Finale'];app.innerHTML=`<header><h1>natalinka song bracket</h1><div class="sub">${esc(modeName(state.mode))}${state.playlistName?' · '+esc(state.playlistName):''}</div></header><div class="progress"><div class="label"><span>${state.picks} / ${totalPicks()} vyberov</span><span>${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div><div class="round"><h2>${roundNames[state.round]||'Kolo '+(state.round+1)}</h2><div>zapas ${state.pairIdx+1} z ${state.current.length/2}</div></div><div class="match">${songCard(a,0)}<div class="vs">VS</div>${songCard(b,1)}</div><div class="controls"><button onclick="undo()" ${state.snaps.length?'':'disabled'}>krok spat</button><button onclick="restart()">zacat odznova</button></div>`}
function place(s,label,emoji){return s?`<div class="place"><small>${emoji} ${label}</small><b>${esc(s.title)}</b><div class="meta">${esc(s.artist)} · ${esc(s.album)}</div></div>`:''}
function renderFinish(){let winner=state.next[0], finalist=(state.losersByRound[state.round]||[])[0], semis=state.losersByRound[state.round-1]||[], h=histories().map(x=>`<div class="hist">${esc(x.date)} · ${esc(x.mode)} · <b>${esc(x.winner)}</b></div>`).join('');app.innerHTML=`<header><h1>mame vitaza</h1><div class="sub">🐱 🐰  bracket prezil az do konca</div></header><section class="panel bubble"><div class="pet">(=^･ω･^=)</div><div>Najviac klikana vec dnes: <b>${esc(winner.title)}</b>. Natalia sud rozhodla.</div></section><section class="podium">${place(winner,'vitaz','🏆')}${place(finalist,'finalista','🥈')}${semis.map((s,i)=>place(s,'semifinale','🐭')).join('')}</section><div class="controls"><button onclick="undo()">krok spat</button><button class="primary" onclick="restart()">novy bracket</button></div><section class="panel"><div class="bubble"><div class="pet">((( •ᴗ•)</div><div>Historia poslednych piatich</div></div><div class="history">${h}</div></section>`}
function burst(){['🐱','🐰','🐀','🐭','✨','💿'].forEach((e,i)=>{let d=document.createElement('div');d.className='confetti';d.textContent=e;d.style.setProperty('--x',(Math.cos(i)*150)+'px');d.style.setProperty('--y',(-80-Math.sin(i)*120)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),900)})}function render(){if(!state)return renderStart();if(state.finished)return renderFinish();renderGame()}load();render();
</script></body></html>
